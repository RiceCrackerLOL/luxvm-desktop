name: Build LuxVM Desktop App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Execute Production Build and Electron Packaging
        run: npm run build

      - name: Upload Windows Standalone App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuxVM-Windows-App
          path: |
            release/win-unpacked/
            release/*.exe
            release/*.zip
