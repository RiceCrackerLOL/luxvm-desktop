name: Build LuxVM Desktop App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Project Dependencies
        run: npm install

      - name: Run Production Build and Package Executable
        run: npm run build

      - name: Verify Generated Output Directories
        run: |
          Write-Host "Verifying workspace folders after build:"
          if (Test-Path "release") { 
            Write-Host "Found release/ folder:"
            Get-ChildItem -Recurse release 
          } else { 
            Write-Host "release/ folder not found." 
          }
          
          if (Test-Path "dist") { 
            Write-Host "Found dist/ folder:"
            Get-ChildItem -Recurse dist 
          } else { 
            Write-Host "dist/ folder not found." 
          }

      - name: Upload Windows Standalone App Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LuxVM-Windows-App
          path: |
            release/
            dist/
            dist-electron/
          if-no-files-found: warn
